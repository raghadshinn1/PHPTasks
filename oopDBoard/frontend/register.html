<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        form {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 15px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #0d1c42;
            color: white;
            border: none;
            cursor: pointer;
        }
        .error {
            color: #c62828;
            text-align: center;
            margin-bottom: 10px;
        }
        .success {
            color: #2e7d32;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <form id="registerForm">
        <h2>Create Account</h2>
        <div id="messageContainer"></div>
        
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8">

        <button type="submit">Register</button>
    </form>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgContainer = document.getElementById('messageContainer');

            fetch('../oopDBoard/api/register_api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    msgContainer.innerHTML = `<p class="success">${data.message}</p>`;
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    msgContainer.innerHTML = `<p class="error">${data.message}</p>`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                msgContainer.innerHTML = `<p class="error">An unexpected error occurred.</p>`;
            });
        });
    </script>

</body>
</html>
